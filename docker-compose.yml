services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      CONVERTER_MODEL: ${CONVERTER_MODEL:-deepseek-flash}
      FASTEMBED_MODEL: ${FASTEMBED_MODEL:-BAAI/bge-small-zh-v1.5}
      FASTEMBED_CACHE_DIR: /app/.data/fastembed
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-converter_engineering_copilot_bge_small_zh_v1_5}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-converter-engineering-copilot}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      CONVERTER_DB_PATH: /app/.data/converter_copilot.db
      CHROMA_PERSIST_DIR: /app/.data/chroma
      WEB_ORIGIN: http://localhost:5173
      CONVERTER_WORKER_CONCURRENCY: ${CONVERTER_WORKER_CONCURRENCY:-1}
      CONVERTER_WORKER_POLL_SECONDS: ${CONVERTER_WORKER_POLL_SECONDS:-0.5}
      CONVERTER_TASK_LEASE_SECONDS: ${CONVERTER_TASK_LEASE_SECONDS:-60}
      CONVERTER_TASK_TIMEOUT_SECONDS: ${CONVERTER_TASK_TIMEOUT_SECONDS:-1800}
      CONVERTER_TASK_MAX_ATTEMPTS: ${CONVERTER_TASK_MAX_ATTEMPTS:-3}
    volumes:
      - converter_data:/app/.data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  converter_data:
